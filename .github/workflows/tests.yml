name: Tests

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

jobs:
  test:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: true
      matrix:
        php: ['7.1', '7.2', '7.3', '7.4', '8.0', '8.1', '8.2', '8.3', '8.4']
        include:
          - php: '7.1'
            phpunit: '^7.5'
          - php: '7.2'
            phpunit: '^8.5'
          - php: '7.3'
            phpunit: '^9.5'
          - php: '7.4'
            phpunit: '^9.5'
          - php: '8.0'
            phpunit: '^9.5'
          - php: '8.1'
            phpunit: '^10.0'
          - php: '8.2'
            phpunit: '^10.0'
          - php: '8.3'
            phpunit: '^11.0'
          - php: '8.4'
            phpunit: '^11.0'

    name: PHP ${{ matrix.php }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: mbstring
          coverage: none

      - name: Install dependencies
        run: |
          composer require "phpunit/phpunit:${{ matrix.phpunit }}" --dev --no-update
          composer update --prefer-dist --no-interaction --no-progress

      - name: Run tests
        run: vendor/bin/phpunit
